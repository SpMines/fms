<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>XAUUSD Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:linear-gradient(160deg,#000 0%,#0a0a0f 48%,#050507 100%);--txt:#eef0f7;--muted:#9aa0b4;--accent:#7c5cff;--accent2:#46b5ff;--danger:#ff5d6c;--ok:#37d399;--warn:#ffb547;
  --glass:rgba(10,10,14,.60);--card:rgba(255,255,255,.04);--brd:rgba(255,255,255,.08);--inp:rgba(255,255,255,.035);
  --shadow:0 30px 80px rgba(0,0,0,.7);--blob:.14;--buy:#37d399;--buybg:rgba(55,211,153,.10);--sell:#ff5d6c;--sellbg:rgba(255,93,108,.10);
  --wait:#ffb547;--waitbg:rgba(255,181,71,.10);--nd:#c2c7d6;--ndbg:rgba(154,160,180,.08)}
[data-theme="light"]{--bg:linear-gradient(160deg,#eef0f6 0%,#f6f7fb 100%);--txt:#1a1c28;--muted:#5f6478;--accent:#6a4bff;--accent2:#1f8dff;
  --glass:rgba(255,255,255,.80);--card:rgba(0,0,0,.025);--brd:rgba(0,0,0,.10);--inp:rgba(0,0,0,.03);
  --shadow:0 20px 50px rgba(60,70,120,.14);--blob:.22;--buy:#15a66d;--buybg:rgba(21,166,109,.10);--sell:#e0364d;--sellbg:rgba(224,54,77,.08);
  --wait:#c47d12;--waitbg:rgba(196,125,18,.10);--nd:#5f6478;--ndbg:rgba(95,100,120,.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Jost',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.5;transition:color .25s}
.blob{position:fixed;border-radius:50%;filter:blur(110px);opacity:var(--blob);z-index:0;pointer-events:none}
.b1{width:420px;height:420px;background:#4a2fb0;top:-150px;left:-130px}.b2{width:380px;height:380px;background:#14365f;bottom:-160px;right:-120px}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 14px 70px}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.brand{font-size:22px;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.themebtn{margin-left:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--brd);background:var(--inp);color:var(--txt);font-size:19px;cursor:pointer;flex-shrink:0}
.glass{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--brd);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
h4.t{font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.decision{text-align:center;padding:22px 14px;border-radius:15px}.decision .big{font-size:36px;font-weight:800;letter-spacing:2px}.decision .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.d-buy{background:var(--buybg);border:1px solid var(--buy)}.d-buy .big{color:var(--buy)}
.d-sell{background:var(--sellbg);border:1px solid var(--sell)}.d-sell .big{color:var(--sell)}
.d-wait{background:var(--waitbg);border:1px solid var(--wait)}.d-wait .big{color:var(--wait)}
.d-nodata{background:var(--ndbg);border:1px solid var(--nd)}.d-nodata .big{color:var(--nd);font-size:25px}
.act{margin-top:12px;padding:13px 14px;border-radius:12px;background:var(--inp);border:1px solid var(--brd);font-size:14.5px;font-weight:500}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--brd);font-size:14px}.kv:first-child{border-top:none}.kv .k{color:var(--muted)}.kv .v{font-weight:600}
.notes{font-size:13px;color:var(--muted);line-height:1.7}.notes li{margin-left:16px}
.strip{display:flex;flex-wrap:wrap;gap:7px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:3px 10px;border-radius:20px;background:var(--inp);border:1px solid var(--brd)}.pill.ok{color:var(--buy);border-color:var(--buy)}.pill.no{color:var(--sell);border-color:var(--sell)}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;padding:12px 13px;border-radius:11px;background:var(--inp);border:1px solid var(--brd);color:var(--txt);font-size:16px;outline:none;font-family:'Jost'}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.16)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;cursor:pointer;font-family:'Jost';font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 26px rgba(124,92,255,.35)}
.btn.ghost{background:transparent;border:1px solid var(--brd);box-shadow:none;color:var(--txt)}.btn:disabled{opacity:.6}
.muted{color:var(--muted);font-size:12.5px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:10px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:22px}.foot b{color:var(--accent)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--glass);border:1px solid var(--brd);color:var(--txt);padding:12px 18px;border-radius:12px;font-size:13.5px;opacity:0;transition:.3s;z-index:50;backdrop-filter:blur(10px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.setup{background:rgba(255,181,71,.10);border:1px solid rgba(255,181,71,.3);border-radius:14px;padding:16px;font-size:13.5px;color:var(--wait)}
@media(max-width:560px){.row2{grid-template-columns:1fr}.decision .big{font-size:32px}.wrap{padding:16px 12px 70px}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <div class="logo"><div class="brand">XAUUSD</div>
    <button class="themebtn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <div id="signalBox" class="glass"><div class="muted">Loading…</div></div>

  <div class="glass">
    <h4 class="t">Settings — broker · capital · risk</h4>
    <div class="row2">
      <div class="field"><label>Broker</label><input id="broker" type="text"></div>
      <div class="field"><label>Capital (USD)</label><input id="capital" type="number" inputmode="decimal" step="1"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Risk per trade (%)</label><input id="risk_percent" type="number" inputmode="decimal" step="0.1"></div>
      <div class="field"><label>Contract size (oz/lot)</label><input id="contract_size" type="number" inputmode="decimal" step="1"></div>
    </div>
    <div class="field"><label>Alert email</label><input id="email_to" type="email" inputmode="email"></div>
    <div class="row2">
      <div class="field"><label>Email alerts</label><select id="email_enabled"><option value="TRUE">ON</option><option value="FALSE">OFF</option></select></div>
      <div class="field"><label>Telegram alerts</label><select id="telegram_enabled"><option value="FALSE">OFF</option><option value="TRUE">ON</option></select></div>
    </div>
    <details><summary>Telegram setup (optional)</summary>
      <div class="field"><label>Bot token</label><input id="telegram_bot_token" type="text"></div>
      <div class="field"><label>Chat id</label><input id="telegram_chat_id" type="text"></div>
    </details>
    <button class="btn" id="saveBtn" onclick="saveCfg()">Save settings</button>
  </div>

  <div class="glass" style="display:flex;gap:10px">
    <button class="btn ghost" onclick="load()">Refresh</button>
    <button class="btn" id="runBtn" onclick="runNow()">Check now</button>
  </div>

  <div class="foot">Built by <b>Somnath Karmakar</b> · Analysis only — not financial advice · Paper-test first</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== CONFIG: paste your Apps Script Web App /exec URL here ===== */
const API   = "https://script.google.com/macros/s/AKfycbwzRffAoHdIgBxX72hL_PuYmHcjGe1jAEH2oQGSdMTsPETNgyte_A8bMzckSLzxt1JmvA/exec";
const TOKEN = "";   /* optional: must match API_TOKEN script property if you set one */
/* ================================================================ */

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast show';setTimeout(()=>t.className='toast',3000);}
function tParam(){return TOKEN?('&token='+encodeURIComponent(TOKEN)):'';}

function applyTheme(mode){
  if(mode==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeBtn').textContent='☀️';}
  else{document.documentElement.removeAttribute('data-theme');document.getElementById('themeBtn').textContent='🌙';}
  try{localStorage.setItem('xau_theme',mode);}catch(e){}
}
function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';applyTheme(cur==='light'?'dark':'light');}
(function(){var m='dark';try{m=localStorage.getItem('xau_theme')||'dark';}catch(e){}applyTheme(m);})();

function needSetup(){
  document.getElementById('signalBox').innerHTML='<div class="setup">Set your Apps Script URL first: edit this file, put your <b>/exec</b> URL in the <b>API</b> line at the top of the script, then reload.</div>';
}
function load(){
  if(!API||API.indexOf('http')!==0){needSetup();return;}
  fetch(API+'?api=state'+tParam()).then(r=>r.json()).then(render).catch(e=>toast('load error'));
}
function render(state){
  if(!state||state.error){toast(state&&state.error?state.error:'error');return;}
  var cfg=state.config||{}, out=state.latest;
  setIf('broker',cfg.broker);setIf('capital',cfg.capital);setIf('risk_percent',cfg.risk_percent);
  setIf('contract_size',cfg.contract_size);setIf('email_to',cfg.email_to);
  setSel('email_enabled',cfg.email_enabled);setSel('telegram_enabled',cfg.telegram_enabled);
  setIf('telegram_bot_token',cfg.telegram_bot_token);setIf('telegram_chat_id',cfg.telegram_chat_id);

  var box=document.getElementById('signalBox');
  if(!out){box.innerHTML='<div class="muted">No analysis yet. Press <b>Check now</b>, or wait for the 15-min auto-run.</div>';return;}
  var d=out.signal||{}, sz=out.sizing, dec=(d.decision||'WAIT').toUpperCase();
  var cls=dec==='BUY'?'d-buy':dec==='SELL'?'d-sell':(dec.indexOf('NO DATA')>=0?'d-nodata':'d-wait');
  var act;
  if(dec==='BUY'||dec==='SELL'){var lot=(sz&&sz.lots!=null)?sz.lots+' lot':(sz&&sz.error?'size: '+sz.error:'size pending');
    act=dec+' lagao — entry '+esc(d.entry)+', SL '+esc(d.sl)+', TP '+esc(d.tp)+' ('+lot+'). Broker pe KHUD daalo (paper first).';}
  else if(dec.indexOf('NO DATA')>=0) act='Kuch mat karo — data reliable nahi ('+esc(d.reason||'')+').';
  else act='Abhi WAIT — koi valid setup nahi ('+esc(d.reason||'')+').';

  var h='';
  h+='<div class="strip"><span class="pill '+(out.market_open?'ok':'no')+'">'+(out.market_open?'market open':'market closed')+'</span>';
  h+='<span class="pill">updated '+esc(out.generated_utc||'')+'</span><span class="pill">price '+esc(out.price!=null?out.price:'—')+'</span></div>';
  h+='<div class="decision '+cls+'"><div class="big">'+esc(dec)+'</div>'+(d.reason?'<div class="sub">'+esc(d.reason)+'</div>':'')+'</div>';
  h+='<div class="act">👉 '+esc(act)+'</div>';
  if(dec==='BUY'||dec==='SELL'){
    h+='<div class="kv"><span class="k">Entry</span><span class="v">'+esc(d.entry)+'</span></div>';
    h+='<div class="kv"><span class="k">Stop Loss</span><span class="v" style="color:var(--sell)">'+esc(d.sl)+'</span></div>';
    h+='<div class="kv"><span class="k">Take Profit</span><span class="v" style="color:var(--buy)">'+esc(d.tp)+'</span></div>';
    h+='<div class="kv"><span class="k">Risk:Reward</span><span class="v">1 : '+esc(d.rr)+'</span></div>';
    if(sz&&!sz.error)h+='<div class="kv"><span class="k">Size</span><span class="v">'+esc(sz.lots)+' lots (risk $'+esc(sz.risk_usd)+')</span></div>';
    else if(sz&&sz.error)h+='<div class="kv"><span class="k">Size</span><span class="v" style="color:var(--wait)">'+esc(sz.error)+'</span></div>';
    if(d.invalidation)h+='<div class="kv"><span class="k">Invalidation</span><span class="v" style="font-weight:400;font-size:12.5px;max-width:58%;text-align:right">'+esc(d.invalidation)+'</span></div>';
  }
  if(d.notes&&d.notes.length){h+='<h4 class="t" style="margin-top:14px">Reasoning</h4><ul class="notes">';d.notes.forEach(function(n){h+='<li>'+esc(n)+'</li>';});h+='</ul>';}
  box.innerHTML=h;
}
function setIf(id,val){var e=document.getElementById(id);if(e&&document.activeElement!==e&&val!=null&&e.value==='')e.value=val;}
function setSel(id,val){var e=document.getElementById(id);if(e&&document.activeElement!==e&&val!=null)e.value=String(val).toUpperCase();}

function post(body,cb){
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(cb).catch(e=>toast('network error'));
}
function saveCfg(){
  if(!API||API.indexOf('http')!==0){needSetup();return;}
  var b=document.getElementById('saveBtn');b.disabled=true;
  var cfg={broker:v('broker'),capital:v('capital'),risk_percent:v('risk_percent'),contract_size:v('contract_size'),
    email_to:v('email_to'),email_enabled:v('email_enabled'),telegram_enabled:v('telegram_enabled'),
    telegram_bot_token:v('telegram_bot_token'),telegram_chat_id:v('telegram_chat_id')};
  post({action:'saveConfig',token:TOKEN,config:cfg},function(st){b.disabled=false;toast('Settings saved ✓');render(st);});
}
function v(id){return document.getElementById(id).value;}
function runNow(){
  if(!API||API.indexOf('http')!==0){needSetup();return;}
  var b=document.getElementById('runBtn');b.disabled=true;b.textContent='Checking…';
  fetch(API+'?api=run'+tParam()).then(r=>r.json()).then(function(st){b.disabled=false;b.textContent='Check now';render(st);toast('Done ✓');})
    .catch(e=>{b.disabled=false;b.textContent='Check now';toast('error');});
}

load();
setInterval(load,60000);
</script>
</body>
</html>
